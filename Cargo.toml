[package]
name = "gcsf"
description = "Filesystem based on Google Drive"
version = "0.3.9"
repository = "https://github.com/harababurel/gcsf"
authors = ["Sergiu Puscas <srg.pscs@gmail.com>"]
license = "MIT"
keywords = ["google", "drive", "fuse", "filesystem"]
exclude = ["build/**/*.o", "doc/**/*.html", "client_secret.json", "/ci/*"]
edition = "2024"


[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
ctrlc = "3.5.2"
failure = "0.1.8"
fuser = { version = "0.18", features = ["libfuse"] }
futures = {version =  "0.3.34", features = ["executor"]}
google-drive3 = "=7.0.0"
# google-drive3 7.0.0 depends on yup-oauth2 with default features disabled, which
# leaves out `InstalledFlowAuthenticator::builder`. Depend on it directly to turn
# the required feature back on; the re-export at drive_facade.rs stays valid.
yup-oauth2 = { version = "12", default-features = false, features = ["hyper-rustls"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
bytes = "1.12"
id_tree = "1.8.0"
lazy_static = "1.5.1"
libc = "0.2.190"
log = "0.4.34"
lru_time_cache = "0.11.11"
maplit = "1.0.2"
mime-sniffer = "0.1.3"
pretty_env_logger = "0.5.0"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
time = "0.3"
tokio = { version = "1.53", features = ["full"] }
url = "2"
urlencoding = "2"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "form",
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
xdg = "3.0.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
